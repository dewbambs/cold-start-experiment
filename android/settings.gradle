pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
        return flutterSdkPath
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "8.6.0" apply false
    id "org.jetbrains.kotlin.android" version "2.1.21" apply false
}

include ":app"
include ":device_info_example"
include ":url_launcher_example"
include ":hive_example"
include ":camera_example"
include ":sqflite_example"
include ":video_player_example"
include ":carousel_slider_example"
include ":dots_indicator_example"
include ":flutter_cache_manager_example"
include ":flutter_downloader_example"
include ":flutter_staggered_grid_view_example"
